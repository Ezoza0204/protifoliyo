<!DOCTYPE html>
<html lang="uz" data-theme="light"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E'zoza Tolibjonova — Dasturchi</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1df;--sky1:#ffe3b8;--sky2:#fbf1df;--ink:#2a1a22;--mute:#6f5a60;--wine:#7a1530;--blue:#3b6fd0;--amber:#e8a25a;--card:#fffaf0;--line:rgba(42,26,34,.15);--dot:rgba(122,21,48,.12)}
[data-theme=dark]{--bg:#150f22;--sky1:#2b1b4a;--sky2:#150f22;--ink:#f6ecde;--mute:#b8a9bb;--wine:#ee6f8d;--blue:#8aaaf5;--amber:#f2b676;--card:#241b36;--line:rgba(246,236,222,.16);--dot:rgba(238,111,141,.14)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);line-height:1.65;overflow-x:hidden;transition:background .5s,color .5s;
background:radial-gradient(var(--dot) 2.5px,transparent 2.5px) 0 0/38px 38px,linear-gradient(180deg,var(--sky1),var(--sky2) 70%) var(--bg)}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif}
#prog{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--wine),var(--amber),var(--blue));z-index:50}
.stars{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;z-index:0;background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 60%,#fff,transparent),radial-gradient(2px 2px at 55% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 75% 45%,#fff,transparent),radial-gradient(2px 2px at 90% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 20% 90%,#fff,transparent);animation:tw 3s ease-in-out infinite alternate}
[data-theme=dark] .stars{opacity:.8}@keyframes tw{to{opacity:.3}}
.sun{position:fixed;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--amber),transparent 68%);opacity:.55;pointer-events:none;z-index:0;animation:sun 9s ease-in-out infinite alternate}
[data-theme=dark] .sun{background:radial-gradient(circle,#f6ecde,transparent 65%);opacity:.18}@keyframes sun{to{transform:scale(1.15)}}
.trail{position:fixed;width:14px;height:14px;border-radius:50%;background:var(--wine);pointer-events:none;z-index:60;animation:fade .8s forwards;opacity:.7}
@keyframes fade{to{transform:scale(0) translateY(14px);opacity:0}}
.nav{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.logo{font-size:1.7rem;font-weight:800;color:var(--ink);text-decoration:none}.logo span{color:var(--wine)}
.nav nav{display:flex;gap:22px}.nav nav a{color:var(--ink);text-decoration:none;font-weight:600}.nav nav a:hover{color:var(--wine)}
.tools{display:flex;gap:8px}.tools button{min-width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font:600 .9rem Figtree;cursor:pointer;transition:transform .3s}
.tools button:hover{transform:rotate(20deg) scale(1.1)}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
main,footer{position:relative;z-index:1}
section{max-width:1100px;margin:0 auto;padding:90px 24px}
h2{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.05;margin-bottom:22px;font-weight:800}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:88vh}
.hello{color:var(--wine);font-weight:600;font-size:1.1rem}
h1{font-size:clamp(3.2rem,10vw,7rem);line-height:.92;font-weight:800;letter-spacing:-.03em;margin:6px 0 16px}
h1 span{display:inline-block;transition:transform .25s cubic-bezier(.3,2,.5,1),color .25s}
h1 span:hover{transform:translateY(-14px) rotate(-8deg);color:var(--wine)}
.typed{font:italic 500 clamp(1.3rem,3vw,2rem) Fraunces,serif;color:var(--blue);min-height:2.5rem}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--blue);margin-left:3px;vertical-align:middle;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.lead{max-width:44ch;color:var(--mute);margin:12px 0 26px;font-size:1.08rem}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:14px 28px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:600;box-shadow:4px 4px 0 var(--ink);transition:.15s}
.btn:hover{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--wine);border-color:var(--ink);color:#fff}
.stage{position:relative;aspect-ratio:1;max-width:460px;margin-left:auto;width:100%}
.stage .ring{position:absolute;inset:-5%;border:3px dashed var(--wine);border-radius:50%;animation:spin 40s linear infinite;opacity:.5}@keyframes spin{to{transform:rotate(360deg)}}
.stage img{position:absolute;inset:4%;width:92%;height:92%;object-fit:cover;border-radius:46% 54% 42% 58%/55% 45% 55% 45%;border:6px solid var(--card);box-shadow:12px 12px 0 var(--wine);animation:morph 10s ease-in-out infinite alternate}
@keyframes morph{50%{border-radius:58% 42% 55% 45%/42% 58% 42% 58%}}
.note{position:absolute;padding:14px 16px;font:600 .85rem Figtree;color:#3a1522;background:#ffd0dc;box-shadow:0 10px 20px rgba(0,0,0,.22);cursor:grab;user-select:none;touch-action:none;max-width:170px;z-index:3}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:44px;height:16px;margin-left:-22px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}
.n1{top:-4%;left:-12%;transform:rotate(-7deg)}.n2{bottom:6%;right:-8%;transform:rotate(6deg);background:#fff0a6}.n3{bottom:-6%;left:8%;transform:rotate(-3deg);background:#bfe0ff}
.hint{position:absolute;right:0;bottom:-34px;font-size:.8rem;color:var(--mute)}
.marq{overflow:hidden;background:var(--wine);color:#fff;transform:rotate(-1.6deg);margin:20px -20px;padding:14px 0;border-block:3px solid var(--ink);position:relative;z-index:1}
.marq div{display:flex;gap:44px;width:max-content;animation:mq 26s linear infinite;font:italic 600 1.7rem Fraunces,serif}
@keyframes mq{to{transform:translateX(-50%)}}
.about p{max-width:60ch;color:var(--mute);font-size:1.12rem}
.skills{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.skills li{padding:10px 20px;border-radius:999px;background:var(--card);border:2px solid var(--ink);font-weight:600;transition:.25s cubic-bezier(.3,2,.5,1);cursor:default}
.skills li:nth-child(3n){background:var(--wine);color:#fff}.skills li:nth-child(3n+1):hover{background:var(--blue);color:#fff}
.skills li:hover{transform:translateY(-8px) rotate(-5deg) scale(1.08)}
.goals{background:var(--card);border:2px solid var(--ink);border-radius:36px;box-shadow:10px 10px 0 var(--ink);max-width:900px;margin-block:40px}
.sub{color:var(--mute);margin-bottom:20px}
.checklist{list-style:none;padding:0;display:grid;gap:12px}
.checklist li{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;user-select:none;background:var(--bg);transition:.2s}
.checklist li:hover{transform:translateX(8px)}
.box{flex:none;width:28px;height:28px;border:2.5px solid var(--wine);border-radius:8px;display:grid;place-items:center;color:#fff}
.done .box{background:var(--wine);animation:pop .4s}.done span:last-child{text-decoration:line-through;opacity:.6}@keyframes pop{50%{transform:scale(1.4) rotate(12deg)}}
.lvl{display:flex;justify-content:space-between;margin-top:22px;font-weight:600}
.bar{height:14px;border-radius:99px;border:2px solid var(--ink);margin-top:8px;overflow:hidden}#bar{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--wine) 0 12px,var(--amber) 12px 24px);transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:28px;margin-top:30px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:14px 14px 22px;box-shadow:7px 7px 0 var(--ink);transition:transform .15s ease-out}
.card:nth-child(2){margin-top:34px}
.card img{width:100%;border-radius:14px;aspect-ratio:3/2;object-fit:cover}
.card h3{margin:14px 6px 4px;font-size:1.4rem}.card p{margin:0 6px 10px;color:var(--mute);font-size:.95rem}.link{margin-left:6px;color:var(--wine);font-weight:600}
.contact{text-align:center}.contact>p{color:var(--mute)}
.mail{display:inline-block;margin:18px 0 26px;font:800 clamp(1.1rem,4.6vw,2.6rem) Fraunces,serif;color:var(--wine);text-decoration:underline wavy var(--amber);text-underline-offset:8px;word-break:break-all}
.mail:hover{color:var(--blue)}
.socials{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.socials a{padding:11px 24px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;box-shadow:4px 4px 0 var(--ink);transition:.15s}
.socials a:hover{background:var(--blue);color:#fff;transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
footer{text-align:center;padding:30px;color:var(--mute);font-size:.9rem}
.conf{position:fixed;width:11px;height:11px;border-radius:50%;pointer-events:none;z-index:70}
@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:auto}.stage{margin:30px auto 40px;max-width:360px}.nav nav{display:none}.n1{left:-4%}.n2{right:-4%}.card:nth-child(2){margin-top:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

for(let i=0;i<26;i++){const d=document.createElement("i");d.className="conf";d.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]}`;document.body.appendChild(d);
const a=Math.random()*6.28,v=80+Math.random()*120;d.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+90}px)`,opacity:0}],{duration:900+Math.random()*500,easing:"ease-out"}).onfinish=()=>d.remove()}}
$("#checklist").addEventListener("click",e=>{const li=e.target.closest("li");if(!li)return;const i=+li.dataset.i,was=done.includes(i);
done=was?done.filter(x=>x!==i):[...done,i];S.set("done",JSON.stringify(done));render();if(!was)confetti(e.clientX,e.clientY)});
$("#lang").onclick=()=>{lang=lang==="uz"?"en":"uz";S.set("lang",lang);render()};
function setTheme(t){root.dataset.theme=t;$("#theme").textContent=t==="dark"?"☀":"☾";S.set("theme",t)}
$("#theme").onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");
setTheme(S.get("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
(function type(){const r=T[lang].roles[ri%3];ch=Math.max(0,Math.min(ch+(dl?-1:1),r.length));$("#typed").textContent=r.slice(0,ch);let d=dl?40:90;
if(!dl&&ch>=r.length){dl=true;d=1400}else if(dl&&ch<=0){dl=false;ri++;d=300}setTimeout(type,d)})();
let last=0;addEventListener("pointermove",e=>{const n=Date.now();if(n-last<45||e.pointerType==="touch")return;last=n;
const d=document.createElement("i");d.className="trail";d.style.left=e.clientX-7+"px";d.style.top=e.clientY-7+"px";d.style.background=["var(--wine)","var(--blue)","var(--amber)"][n%3];document.body.appendChild(d);setTimeout(()=>d.remove(),800)});
addEventListener("scroll",()=>{$("#prog").style.width=scrollY/(document.body.scrollHeight-innerHeight)*100+"%"});
document.querySelectorAll(".tilt").forEach(c=>{c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*12}deg) rotateX(${-y*12}deg)`});c.addEventListener("pointerleave",()=>c.style.transform="")});
document.querySelectorAll(".note").forEach(n=>{let sx,sy,ox,oy,on=false,rot=n.style.transform;
n.addEventListener("pointerdown",e=>{on=true;n.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=n.offsetLeft;oy=n.offsetTop;n.style.cursor="grabbing";n.style.zIndex=9;
const cs=getComputedStyle(n).transform;n.dataset.r=cs});
n.addEventListener("pointermove",e=>{if(!on)return;n.style.left=ox+e.clientX-sx+"px";n.style.top=oy+e.clientY-sy+"px";n.style.right=n.style.bottom="auto"});
n.addEventListener("pointerup",()=>{on=false;n.style.cursor="grab"})});
render();
</script></body></html>
